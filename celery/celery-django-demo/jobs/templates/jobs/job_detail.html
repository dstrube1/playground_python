<!DOCTYPE html>
<html>
<head>
    <title>Job {{ job.id }}</title>
</head>
<body>
    <h1>Job {{ job.id }}</h1>

    <p>
        <strong>Input:</strong>
        {{ job.input_text }}
    </p>

    <p>
        <strong>Status:</strong>
        <span id="job-status">{{ job.status }}</span>
    </p>

    <p id="job-result-container" {% if not job.result %}style="display: none;"{% endif %}>
    <strong>Result:</strong>
    <span id="job-result">{{ job.result }}</span>
</p>

<p id="job-completed-container" {% if not job.completed_at %}style="display: none;"{% endif %}>
    <strong>Completed:</strong>
    <span id="job-completed">{{ job.completed_at }}</span>
</p>

<p>
    <a href="{% url 'create_job' %}">Create another job</a>
</p>

<script>
	// statusUrl is generated by Django
    const statusUrl = "{% url 'job_status' job.id %}";

    async function updateJobStatus() {
        try {
        	// fetch() calls the Django endpoint
            const response = await fetch(statusUrl);

            if (!response.ok) {
                throw new Error("Failed to fetch job status");
            }

            const data = await response.json();

            document.getElementById("job-status").textContent = data.status;

            if (data.result) {
                document.getElementById("job-result").textContent = data.result;
                document.getElementById("job-result-container").style.display = "block";
            }

            if (data.completed_at) {
                document.getElementById("job-completed").textContent = data.completed_at;
                document.getElementById("job-completed-container").style.display = "block";
            }

            if (data.status === "COMPLETED") {
                clearInterval(statusInterval);
            }
        } catch (error) {
            console.error("Error updating job status:", error);
        }
    }
	
	//Poll once per second
    const statusInterval = setInterval(updateJobStatus, 1000);

    updateJobStatus();
</script>

</body>
</html>
